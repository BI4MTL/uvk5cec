name: Docker Image CI

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 构建 Docker 镜像
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:latest

    # 2. 运行容器并提取 .bin 文件（假设输出路径是 /app/build）
    # 你需要根据你的 Dockerfile 里的实际输出路径修改下面这两行
    - name: Extract bin file from Docker image
      run: |
        docker create --name temp_container my-image-name:latest
        docker cp temp_container:/app/build/firmware.bin ./firmware.bin
        docker rm temp_container

    # 3. 直接上传 .bin 文件（不再上传巨大的镜像）
    - name: Upload bin artifact
      uses: actions/upload-artifact@v4
      with:
        name: firmware-bin
        path: ./firmware.bin
