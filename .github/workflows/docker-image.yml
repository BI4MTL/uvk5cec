name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 构建 Docker 镜像
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:latest

    # 2. 从 Docker 镜像里提取 /app/utils 文件夹
    - name: Extract bin files from Docker image
      run: |
        docker create --name temp_container my-image-name:latest
        docker cp temp_container:/app/utils ./firmware_output
        docker rm temp_container

    # 3. 将提取出来的文件夹上传，生成下载链接
    - name: Upload bin artifact
      uses: actions/upload-artifact@v4
      with:
        name: uv-k5-firmware
        path: ./firmware_output/
