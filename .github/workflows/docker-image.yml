name: Docker Image CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    # 1. 构建 Docker 镜像（将标签改为固定的 latest）
    - name: Build the Docker image
      run: docker build . --file Dockerfile --tag my-image-name:latest

    # 2. 将 Docker 镜像保存为 tar 压缩包
    - name: Save Docker image to tar
      run: docker save -o my-image.tar my-image-name:latest

    # 3. 上传 tar 压缩包，生成下载链接
    - name: Upload Docker image artifact
      uses: actions/upload-artifact@v4
      with:
        name: docker-image-download  # 下载链接显示的名字
        path: my-image.tar           # 要上传的文件路径
